services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.4-alpine
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "8123:8123"
    environment:
      CLICKHOUSE_DB:       angelix
      CLICKHOUSE_USER:     angelix
      CLICKHOUSE_PASSWORD: angelix
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./docker/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  server:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ANGELIX_ADMIN_TOKEN:     ${ANGELIX_ADMIN_TOKEN:-secret}
      PORT:                    8080
      ANGELIX_DB:              /data/angelix.db
      DEBUG:                   ${DEBUG:-0}
      CLICKHOUSE_ADDR:         clickhouse:9000
      CLICKHOUSE_DB:           angelix
      CLICKHOUSE_USER:         angelix
      CLICKHOUSE_PASSWORD:     angelix
    volumes:
      - server_data:/data
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  clickhouse_data:
  server_data:
